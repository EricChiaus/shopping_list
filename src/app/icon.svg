<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Orange rounded background -->
  <rect width="32" height="32" rx="7" fill="#f97316"/>
  <!-- Fork: 3 tines -->
  <line x1="9"  y1="5" x2="9"  y2="11" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="12" y1="5" x2="12" y2="11" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="15" y1="5" x2="15" y2="11" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Fork: tine base curve into handle -->
  <path d="M9 11 Q9 14 12 14 Q15 14 15 11" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Fork: handle -->
  <line x1="12" y1="14" x2="12" y2="27" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Knife: blade + handle -->
  <path d="M21 5 C23 5 24 8 24 12 L21 12" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="21" y1="5"  x2="21" y2="27" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
</svg>
